# fly.toml app configuration file generated for mochi-website on 2026-09-11T23:15:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mochi-website'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # The Dockerfile now does the full build (compile + generate) at image-build
  # time instead of re-running it on every container boot, so the running
  # machine only ever serves the already-built app (`next start`) — 512MB is
  # comfortable for that. If you ever see OOM errors in `fly logs` again,
  # bump this back up.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
